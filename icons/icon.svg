<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo Cuadrado Redondeado -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#273759" stroke-width="6"/>

  <!-- Anillo exterior brillante -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" filter="url(#glow)"/>

  <!-- Moneda / Círculo Central Dorado -->
  <circle cx="256" cy="256" r="140" fill="url(#goldGrad)"/>
  <circle cx="256" cy="256" r="126" fill="none" stroke="#fef3c7" stroke-width="5" stroke-dasharray="10, 8"/>

  <!-- Símbolo Euro (€) -->
  <text x="256" y="305" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="160" fill="#0b0f19" text-anchor="middle">€</text>

  <!-- Flechas de Flujo / Adelanto (Intercambio Dinero) -->
  <g transform="translate(256, 110)">
    <polygon points="0,-25 25,10 8,10 8,35 -8,35 -8,10 -25,10" fill="#34d399"/>
  </g>
  <g transform="translate(256, 402)">
    <polygon points="0,25 25,-10 8,-10 8,-35 -8,-35 -8,-10 -25,-10" fill="#38bdf8"/>
  </g>
</svg>
